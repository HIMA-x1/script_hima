<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINEBET - Apple of Fortune</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #001a09; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 450px; background: linear-gradient(180deg, #003311, #004d1a); padding: 15px; display: flex; flex-direction: column; }
        
        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #001f0a; padding: 12px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .balance { font-size: 18px; font-weight: bold; cursor: pointer; }
        .balance span { color: #00ff00; }
        
        /* Game Area */
        h2 { text-align: center; font-size: 16px; margin-bottom: 15px; color: #fff; letter-spacing: 1px; }
        .game-area { display: flex; gap: 5px; }
        
        .multiplier-col { display: flex; flex-direction: column-reverse; justify-content: space-between; padding-bottom: 40px; }
        .multiplier-col span { font-size: 11px; color: #aaffaa; font-weight: bold; text-align: right; width: 40px; }
        
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex-grow: 1; }
        .barrel { 
            background: radial-gradient(circle at 30% 30%, #a0522d, #5c2e0b); 
            border: 2px solid #3a1a05; 
            border-radius: 50%; 
            aspect-ratio: 1; 
            cursor: pointer; 
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8); 
            display: flex; justify-content: center; align-items: center; font-size: 24px;
            transition: 0.2s;
        }
        .barrel:active { transform: scale(0.9); }
        .barrel.opened { background: none; border: none; box-shadow: none; cursor: default; }
        
        /* Controls */
        .stake-section { margin-top: 20px; background: #002208; padding: 10px; border-radius: 8px; }
        .stake-input { width: 100%; padding: 15px; background: #333; border: 1px solid #555; color: white; border-radius: 5px; font-size: 18px; text-align: center; font-weight: bold; margin-bottom: 10px; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn { flex: 1; padding: 12px 5px; border: none; border-radius: 5px; font-weight: bold; color: white; background: #00aa44; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn:hover { background: #008833; }
        .btn.danger { background: #cc0000; }
        .btn.danger:hover { background: #aa0000; }
        
        /* Admin Hidden */
        .admin-hint { font-size: 10px; color: #555; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div>10012.42 EGP</div>
            <div class="balance" onclick="adminCharge()">Balance: <span id="balanceDisplay">0.00</span> EGP</div>
        </div>

        <h2>APPLE OF FORTUNE</h2>

        <!-- Game Grid -->
        <div class="game-area">
            <div class="multiplier-col" id="multiplierCol"></div>
            <div class="grid" id="grid"></div>
        </div>

        <!-- Controls -->
        <div class="stake-section">
            <input type="number" id="stakeAmount" class="stake-input" value="150" min="10">
            <div class="btn-row">
                <button class="btn" onclick="setStake('min')">MIN</button>
                <button class="btn" onclick="setStake('x2')">X2</button>
                <button class="btn" onclick="setStake('/2')">X/2</button>
                <button class="btn" onclick="setStake('max')">MAX</button>
            </div>
            <div class="btn-row">
                <button class="btn danger" onclick="startGame()">STAKE</button>
                <button class="btn" onclick="cashOut()">TAKE WINNINGS</button>
            </div>
        </div>
        <div class="admin-hint">Click "Balance" to simulate Admin Charge</div>
    </div>

    <script>
        // Setup
        const multipliers = [1.23, 1.50, 2.10, 3.50, 6.00, 12.00, 28.00, 75.00, 150.00, 349.68];
        let currentBalance = 0.00;
        let gameActive = false;
        let currentRow = 0;
        let currentMultiplier = 1.23;
        let predictions = []; // Read from Zero Bet

        // Initialize Game
        function init() {
            renderMultipliers();
            renderGrid();
            updateBalance();
            
            // Get predictions from ZERO BET app
            let savedPreds = localStorage.getItem('zeroBetPredictions');
            if (savedPreds) {
                predictions = JSON.parse(savedPreds);
            } else {
                // Fallback if Zero Bet wasn't played
                for (let i = 0; i < 10; i++) predictions.push(Math.floor(Math.random() * 5));
            }
        }

        function renderMultipliers() {
            let col = document.getElementById('multiplierCol');
            multipliers.forEach(m => {
                let span = document.createElement('span');
                span.innerText = 'x' + m;
                col.appendChild(span);
            });
        }

        function renderGrid() {
            let grid = document.getElementById('grid');
            grid.innerHTML = '';
            // Render from top to bottom visually, but logic uses row index (0 = bottom)
            for (let visualRow = 9; visualRow >= 0; visualRow--) {
                for (let col = 0; col < 5; col++) {
                    let barrel = document.createElement('div');
                    barrel.className = 'barrel';
                    barrel.dataset.row = visualRow;
                    barrel.dataset.col = col;
                    barrel.onclick = () => clickBarrel(barrel, visualRow, col);
                    grid.appendChild(barrel);
                }
            }
        }

        // Admin Panel (Click Balance to add money)
        function adminCharge() {
            let amount = prompt("Admin Panel: Enter amount to add:", "1000");
            if (amount && !isNaN(amount)) {
                currentBalance += parseFloat(amount);
                updateBalance();
            }
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2);
        }

        // Stake Controls
        function setStake(type) {
            let input = document.getElementById('stakeAmount');
            let val = parseFloat(input.value) || 10;
            if (type === 'min') input.value = 10;
            if (type === 'x2') input.value = (val * 2).toFixed(2);
            if (type === '/2') input.value = Math.max(10, (val / 2)).toFixed(2);
            if (type === 'max') input.value = currentBalance > 0 ? currentBalance.toFixed(2) : 10;
        }

        // Game Logic
        function startGame() {
            let stake = parseFloat(document.getElementById('stakeAmount').value);
            if (stake > currentBalance) {
                alert("Insufficient balance! Click Balance for Admin Charge.");
                return;
            }
            if (stake < 10) {
                alert("Minimum stake is 10 EGP.");
                return;
            }

            // Refresh predictions from Zero Bet in case it was updated
            let savedPreds = localStorage.getItem('zeroBetPredictions');
            if (savedPreds) predictions = JSON.parse(savedPreds);

            currentBalance -= stake;
            updateBalance();
            
            gameActive = true;
            currentRow = 0;
            currentMultiplier = multipliers[0];
            
            // Reset Grid
            document.querySelectorAll('.barrel').forEach(b => {
                b.classList.remove('opened');
                b.innerText = '';
            });
            
            alert("Game Started! Follow Zero Bet predictions. Start from the bottom row.");
        }

        function clickBarrel(el, row, col) {
            if (!gameActive) return;
            if (row !== currentRow) {
                alert("You must play from bottom to top! Row " + (currentRow + 1) + " is next.");
                return;
            }
            if (el.classList.contains('opened')) return;

            // Check if this column matches the prediction for this row
            let isWinner = (col === predictions[row]);
            
            el.classList.add('opened');
            
            if (isWinner) {
                el.innerText = '🍄'; // Apple
                currentMultiplier = multipliers[currentRow];
                currentRow++;
                if (currentRow === 10) {
                    alert("Congratulations! You reached the top. Click TAKE WINNINGS.");
                }
            } else {
                el.innerText = '💀'; // Skull
                gameActive = false;
                alert("Wrong barrel! You lost. Game Over.");
            }
        }

        function cashOut() {
            if (!gameActive && currentRow === 0) return;
            if (currentRow === 0) {
                alert("Open at least one barrel first.");
                return;
            }
            
            let stake = parseFloat(document.getElementById('stakeAmount').value);
            let winnings = stake * currentMultiplier;
            currentBalance += winnings;
            updateBalance();
            
            gameActive = false;
            alert(`Cashed out! You won ${winnings.toFixed(2)} EGP (x${currentMultiplier})`);
        }

        window.onload = init;
    </script>
</body>
</html>

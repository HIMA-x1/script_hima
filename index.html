<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LINEBET - Apple of Fortune</title>
    <style>
        :root {
            --bg-color: #0b141a;
            --accent-green: #25c26e;
            --accent-red: #ff4b55;
            --card-bg: #121b22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
        body { background: var(--bg-color); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; max-height: 900px; background: #070e13; display: flex; flex-direction: column; position: relative; border: 1px solid rgba(37,194,110,0.3); }

        .game-container { padding: 12px; display: flex; flex-direction: column; height: 100%; gap: 10px; }
        .game-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .online-badge { color: var(--accent-green); font-weight: bold; }
        .balance-box { background: rgba(37,194,110,0.15); border: 1px solid var(--accent-green); padding: 4px 14px; border-radius: 20px; font-weight: bold; color: var(--accent-green); display: flex; align-items: center; gap: 6px; }
        .balance-box button { background: var(--accent-green); border: none; color: #fff; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .game-title { text-align: center; font-size: 1rem; font-weight: bold; color: #ddd; letter-spacing: 1px; }

        .apple-grid { display: flex; flex-direction: column; gap: 5px; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); flex-grow: 1; justify-content: center; }
        .grid-row { display: flex; justify-content: space-between; gap: 5px; }
        .apple-cell { flex: 1; aspect-ratio: 1; background: linear-gradient(135deg, #3a2618, #22150c); border: 2px solid #5a3d28; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .apple-cell.revealed { background: rgba(37,194,110,0.3); border-color: var(--accent-green); }

        .bet-controls { background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 8px; }
        .stake-row { display: flex; gap: 8px; }
        .stake-input-wrap { flex: 1; display: flex; align-items: center; background: #070a0f; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 0 10px; }
        .stake-input-wrap input { width: 100%; background: transparent; border: none; color: #fff; font-size: 1.1px; padding: 8px 0; outline: none; font-weight: bold; font-size: 1rem; }
        .currency-label { color: #888; font-size: 0.9rem; }
        .stake-btn { background: var(--accent-green); color: #fff; border: none; padding: 0 22px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .multiplier-chips { display: flex; gap: 6px; }
        .chip-btn { flex: 1; background: #1c2638; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 0; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="game-container">
        <div class="game-header">
            <div class="online-badge">🟢 ONLINE: 930</div>
            <div class="balance-box">
                <span id="accountBalance">150.00</span> ج.م
                <button onclick="addBalance()">+</button>
            </div>
        </div>

        <div class="game-title">APPLE OF FORTUNE</div>

        <div class="apple-grid" id="appleGrid"></div>

        <div class="bet-controls">
            <div class="stake-row">
                <div class="stake-input-wrap">
                    <input type="number" id="stakeInput" value="20" min="10" max="66319">
                    <span class="currency-label">ج.م</span>
                </div>
                <button class="stake-btn" onclick="placeStake()">STAKE</button>
            </div>
            <div class="multiplier-chips">
                <button class="chip-btn" onclick="setStake(10)">MIN</button>
                <button class="chip-btn" onclick="setStake(50)">X/2</button>
                <button class="chip-btn" onclick="setStake(200)">X2</button>
                <button class="chip-btn" onclick="setStake(1000)">MAX</button>
            </div>
        </div>
    </div>
</div>

<script>
    let balance = 150.00;
    const balanceEl = document.getElementById('accountBalance');
    const stakeInput = document.getElementById('stakeInput');
    const appleGrid = document.getElementById('appleGrid');

    function updateUI() {
        balanceEl.textContent = balance.toFixed(2);
    }
    function setStake(val) { stakeInput.value = val; }
    function addBalance() { balance += 150; updateUI(); }

    function buildGrid() {
        appleGrid.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            const row = document.createElement('div');
            row.className = 'grid-row';
            for (let c = 0; c < 5; c++) {
                const cell = document.createElement('div');
                cell.className = 'apple-cell';
                cell.textContent = '🪵';
                row.appendChild(cell);
            }
            appleGrid.appendChild(row);
        }
    }

    function placeStake() {
        const stake = Number(stakeInput.value);
        if (stake <= 0) { alert('أدخل مبلغ صحيح!'); return; }
        if (stake > balance) { alert('رصيدك غير كافٍ!'); return; }
        
        balance -= stake; // خصم المبلغ فوراً من رصيد الـ 150
        updateUI();
        buildGrid();

        // إظهار تفاحة سليمة في الصف الأخير كمحاكاة
        const rows = appleGrid.querySelectorAll('.grid-row');
        const cells = rows[7].querySelectorAll('.apple-cell');
        const safeIdx = Math.floor(Math.random() * 5);
        cells[safeIdx].textContent = '🍎';
        cells[safeIdx].classList.add('revealed');
    }

    buildGrid();
    updateUI();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINEBET - Apple of Fortune</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        
        /* خلفية اللعبة الخضرا */
        .app-container { width: 100%; max-width: 450px; height: 100vh; position: relative; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(0,30,10,0.9), rgba(0,50,20,0.9)), url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1000&auto=format&fit=crop') center/cover; }
        
        /* الشريط العلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.5); color: white; }
        .balance-box { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px 15px; border-radius: 20px; border: 1px solid #444; }
        .add-funds-btn { background: #00c853; color: white; border: none; width: 25px; height: 25px; border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 16px; display: flex; justify-content: center; align-items: center; }
        
        .game-title { text-align: center; color: white; font-size: 16px; margin: 15px 0; letter-spacing: 1px; }

        /* شبكة اللعب والمضاعفات */
        .game-area { display: flex; padding: 0 10px; flex-grow: 1; gap: 10px; }
        
        .multiplier-col { display: flex; flex-direction: column-reverse; justify-content: space-between; padding-bottom: 10px; width: 60px; }
        .multiplier-col span { font-size: 10px; color: #fff; text-align: right; padding: 2px 5px; border-radius: 5px; }
        .multiplier-col span.active { background: rgba(0, 200, 83, 0.5); font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; flex-grow: 1; padding-bottom: 10px; }
        
        /* تصميم البرميل الخشبي */
        .barrel { 
            background: radial-gradient(circle at 30% 30%, #d2691e, #5c2e0b); 
            border: 2px solid #3a1a05; 
            border-radius: 50%; 
            aspect-ratio: 1; 
            cursor: pointer; 
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.5), 0 3px 5px rgba(0,0,0,0.3); 
            display: flex; justify-content: center; align-items: center; font-size: 24px;
            transition: 0.2s;
            position: relative;
        }
        /* خطوط الخشب */
        .barrel::before { content: ''; position: absolute; width: 80%; height: 80%; border-radius: 50%; border: 1px dashed rgba(0,0,0,0.3); }
        .barrel:active { transform: scale(0.95); }
        .barrel.opened { background: none; border: none; box-shadow: none; cursor: default; }
        
        /* أزرار التحكم السفلية */
        .controls { background: rgba(0,20,10,0.9); padding: 15px; border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; color: white; background: #00c853; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn:active { background: #009624; }
        .btn.secondary { background: #555; }
        .stake-container { display: flex; background: #333; border-radius: 8px; padding: 5px; margin-bottom: 10px; align-items: center; }
        .stake-container input { flex: 1; background: none; border: none; color: white; font-size: 18px; padding: 10px; outline: none; text-align: center; }
        .btn-stake { background: #00c853; padding: 15px 30px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <div class="balance-box">
                <span id="balanceDisplay">0.00 EGP</span>
                <button class="add-funds-btn" onclick="adminCharge()">+</button>
            </div>
            <div style="font-weight: bold; color: #00c853;">LINEBET</div>
        </div>

        <div class="game-title">APPLE OF FORTUNE</div>

        <!-- شبكة اللعب -->
        <div class="game-area">
            <div class="multiplier-col" id="multiplierCol"></div>
            <div class="grid" id="grid"></div>
        </div>

        <!-- التحكم -->
        <div class="controls">
            <div class="btn-row">
                <button class="btn secondary" onclick="setStake('min')">MIN</button>
                <button class="btn secondary" onclick="setStake('x2')">X2</button>
                <button class="btn secondary" onclick="setStake('/2')">X/2</button>
                <button class="btn secondary" onclick="setStake('max')">MAX</button>
            </div>
            <div class="stake-container">
                <input type="number" id="stakeAmount" value="150" min="10">
                <button class="btn-stake" id="actionBtn" onclick="startGame()">STAKE</button>
            </div>
            <div class="btn-row" id="cashoutRow" style="display: none;">
                <button class="btn" style="background: #ff6f00;" onclick="cashOut()">TAKE WINNINGS</button>
            </div>
        </div>
    </div>

    <script>
        const multipliers = [1.23, 1.50, 2.10, 3.50, 6.00, 12.00, 28.00, 75.00, 150.00, 349.68];
        let currentBalance = 0.00;
        let gameActive = false;
        let currentRow = 0;
        let currentMultiplier = 1.23;
        let predictions = [];

        function init() {
            renderMultipliers();
            renderGrid();
            updateBalance();
        }

        function renderMultipliers() {
            let col = document.getElementById('multiplierCol');
            multipliers.forEach((m, index) => {
                let span = document.createElement('span');
                span.innerText = 'x' + m;
                span.id = 'mult-' + index;
                col.appendChild(span);
            });
        }

        function renderGrid() {
            let grid = document.getElementById('grid');
            grid.innerHTML = '';
            // من فوق لتحت بصرياً، بس اللوجيك من تحت لفوق
            for (let visualRow = 9; visualRow >= 0; visualRow--) {
                for (let col = 0; col < 5; col++) {
                    let barrel = document.createElement('div');
                    barrel.className = 'barrel';
                    barrel.dataset.row = visualRow;
                    barrel.dataset.col = col;
                    barrel.onclick = () => clickBarrel(barrel, visualRow, col);
                    grid.appendChild(barrel);
                }
            }
        }

        function adminCharge() {
            let amount = prompt("أدخل المبلغ المراد شحنه (Admin):", "1000");
            if (amount && !isNaN(amount)) {
                currentBalance += parseFloat(amount);
                updateBalance();
            }
        }

        function updateBalance() {
            document.getElementById('balanceDisplay').innerText = currentBalance.toFixed(2) + ' EGP';
        }

        function setStake(type) {
            let input = document.getElementById('stakeAmount');
            let val = parseFloat(input.value) || 10;
            if (type === 'min') input.value = 10;
            if (type === 'x2') input.value = (val * 2).toFixed(2);
            if (type === '/2') input.value = Math.max(10, (val / 2)).toFixed(2);
            if (type === 'max') input.value = currentBalance > 0 ? currentBalance.toFixed(2) : 10;
        }

        function startGame() {
            let stake = parseFloat(document.getElementById('stakeAmount').value);
            if (stake > currentBalance) {
                alert("رصيدك غير كافي! اضغط على زرار (+) لشحن الرصيد.");
                return;
            }
            if (stake < 10) {
                alert("أقل مبلغ للرهان هو 10 EGP.");
                return;
            }

            // قراءة التوقعات من تطبيق ZERO BET
            let savedPreds = localStorage.getItem('zeroBetPreds');
            if (!savedPreds) {
                alert("من فضلك افتح تطبيق ZERO BET أولاً وقم بتسجيل الدخول لتوليد التوقعات!");
                return;
            }
            predictions = JSON.parse(savedPreds);

            // خصم الرصيد
            currentBalance -= stake;
            updateBalance();
            
            // تصفير اللعبة
            gameActive = true;
            currentRow = 0;
            currentMultiplier = multipliers[0];
            
            document.querySelectorAll('.barrel').forEach(b => {
                b.classList.remove('opened');
                b.innerText = '';
            });
            document.querySelectorAll('.multiplier-col span').forEach(s => s.classList.remove('active'));
            
            document.getElementById('actionBtn').innerText = "PLAYING...";
            document.getElementById('actionBtn').style.background = "#555";
            document.getElementById('cashoutRow').style.display = 'flex';
        }

        function clickBarrel(el, row, col) {
            if (!gameActive) return;
            if (row !== currentRow) {
                alert("يجب أن تلعب من الأسفل إلى الأعلى! الصف الحالي هو " + (currentRow + 1));
                return;
            }
            if (el.classList.contains('opened')) return;

            // التحقق من التوقع
            let isWinner = (col === predictions[row]);
            
            el.classList.add('opened');
            
            if (isWinner) {
                el.innerText = '🍄';
                currentMultiplier = multipliers[currentRow];
                
                // إضاءة المضاعف الحالي
                document.getElementById('mult-' + currentRow).classList.add('active');
                
                currentRow++;
                if (currentRow === 10) {
                    alert("مبروك! وصلت للقمة. اضغط TAKE WINNINGS لسحب الأرباح.");
                    gameActive = false;
                }
            } else {
                el.innerText = '💀';
                gameActive = false;
                alert("برميل خاطئ! للأسف خسرت. راجع تطبيق ZERO BET.");
                resetGameState();
            }
        }

        function cashOut() {
            if (!gameActive && currentRow === 0) return;
            if (currentRow === 0) {
                alert("افتح برميل واحد على الأقل أولاً.");
                return;
            }
            
            let stake = parseFloat(document.getElementById('stakeAmount').value);
            let winnings = stake * currentMultiplier;
            currentBalance += winnings;
            updateBalance();
            
            alert(`تم السحب بنجاح! ربحت ${winnings.toFixed(2)} EGP (مضاعف x${currentMultiplier})`);
            resetGameState();
        }

        function resetGameState() {
            gameActive = false;
            currentRow = 0;
            document.getElementById('actionBtn').innerText = "STAKE";
            document.getElementById('actionBtn').style.background = "#00c853";
            document.getElementById('cashoutRow').style.display = 'none';
        }

        window.onload = init;
    </script>
</body>
</html>

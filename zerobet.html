<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO BET - Hacker Predictor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0a0a; color: #fff; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        /* خلفية الهكر */
        .app-container { width: 100%; max-width: 450px; position: relative; z-index: 1; padding: 20px; background: linear-gradient(180deg, rgba(10,10,10,0.8), rgba(40,0,0,0.9)), url('https://i.imgur.com/your_reaper_image.jpg') center/cover; min-height: 100vh; display: flex; flex-direction: column; }
        
        .hacker-header { text-align: center; margin-bottom: 20px; border: 2px solid #ff0000; border-radius: 10px; padding: 15px; background: rgba(0,0,0,0.7); box-shadow: 0 0 15px #ff0000; }
        .hacker-header h2 { color: #ff0000; letter-spacing: 2px; text-shadow: 0 0 10px #ff0000; margin-bottom: 5px; }
        .hacker-header p { color: #aaa; font-size: 12px; }

        /* شاشة الدخول */
        .login-box { background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; border: 1px solid #333; margin-top: 50px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; background: #111; border: 1px solid #ff0000; color: #fff; border-radius: 5px; text-align: center; }
        .login-box button { width: 100%; padding: 12px; background: #ff0000; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* واجهة التوقعات */
        .predictor-ui { display: none; flex-direction: column; align-items: center; background: #fff; padding: 20px; border-radius: 20px; margin-top: 20px; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        .boxes-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .predict-box { width: 50px; height: 50px; background: #fce4ec; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); transition: 0.3s; }
        .predict-box.active { background: #ffeb3b; box-shadow: 0 0 15px #ffeb3b; transform: scale(1.1); }
        
        .control-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .btn-dark { width: 100%; padding: 15px; background: #1a1a2e; color: #fff; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .btn-dark:active { background: #16213e; }
        
        .instruction { font-size: 14px; color: #333; text-align: center; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- شاشة الدخول -->
        <div id="loginScreen">
            <div class="hacker-header">
                <h2>ZERO BET</h2>
                <p>Cyber Prediction Engine</p>
            </div>
            <div class="login-box">
                <input type="text" id="playerId" placeholder="Player ID (10 Digits)">
                <input type="password" id="playerPass" placeholder="Password (TE100)">
                <button onclick="login()">تسجيل الدخول</button>
            </div>
        </div>

        <!-- واجهة التوقع -->
        <div id="predictorScreen" class="predictor-ui">
            <div class="instruction" id="instructionText">اضغط على "بدء التوقع" لمعرفة مكان التفاحة</div>
            
            <!-- الخمس مربعات -->
            <div class="boxes-row" id="boxesRow">
                <div class="predict-box" id="box0"></div>
                <div class="predict-box" id="box1"></div>
                <div class="predict-box" id="box2"></div>
                <div class="predict-box" id="box3"></div>
                <div class="predict-box" id="box4"></div>
            </div>

            <div class="control-btns">
                <button class="btn-dark" onclick="revealNext()">بدء التوقع (Start)</button>
                <button class="btn-dark" style="background:#b71c1c;" onclick="resetGame()">تصفير اللعبة (Reset)</button>
            </div>
        </div>
    </div>

    <script>
        let predictions = [];
        let currentRevealRow = 0;

        function login() {
            let id = document.getElementById('playerId').value;
            let pass = document.getElementById('playerPass').value;

            if (id.length === 10 && pass.toUpperCase() === 'TE100') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('predictorScreen').style.display = 'flex';
                generateNewGame();
            } else {
                alert("تأكد من الـ ID (10 أرقام) والباسورد (TE100)");
            }
        }

        function generateNewGame() {
            predictions = [];
            for (let i = 0; i < 10; i++) {
                predictions.push(Math.floor(Math.random() * 5)); // 0 to 4
            }
            // حفظ التوقعات عشان تطبيق التاني يقراها
            localStorage.setItem('zeroBetPreds', JSON.stringify(predictions));
            localStorage.setItem('zeroBetRow', 0);
            
            currentRevealRow = 0;
            resetBoxes();
            document.getElementById('instructionText').innerText = "جاهز! اضغط Start عشان تبدأ الجولة الأولى في اللعبة.";
        }

        function resetBoxes() {
            for(let i=0; i<5; i++) {
                document.getElementById('box'+i).innerText = '';
                document.getElementById('box'+i).classList.remove('active');
            }
        }

        function revealNext() {
            if (currentRevealRow >= 10) {
                alert("وصلت للنهاية! اعمل تصفير للعبة من فضلك.");
                return;
            }

            resetBoxes();
            let correctBoxIndex = predictions[currentRevealRow];
            
            // إظهار التفاحة
            document.getElementById('box'+correctBoxIndex).innerText = '🍄';
            document.getElementById('box'+correctBoxIndex).classList.add('active');
            
            document.getElementById('instructionText').innerText = `الجولة ${currentRevealRow + 1}: التفاحة في المربع رقم ${correctBoxIndex + 1}`;
            
            // تحديث الصف عشان اللعبة التانية تقرأه
            localStorage.setItem('zeroBetRow', currentRevealRow);
            currentRevealRow++;
        }

        function resetGame() {
            generateNewGame();
        }
    </script>
</body>
</html>

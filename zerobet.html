<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO BET - Official</title>
    <style>
        /* إعدادات عامة */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        
        /* الخلفية السوداء الأساسية */
        body { 
            background-color: #000; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }
        
        /* خلفية الماتريكس (الكانفاس) */
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.4; pointer-events: none; }
        
        /* الحاوية الرئيسية */
        .app-container { width: 100%; max-width: 450px; height: 100dvh; position: relative; z-index: 1; display: flex; flex-direction: column; padding: 15px; }

        /* =============================== */
        /* 1. شاشة تسجيل الدخول (Login) */
        /* =============================== */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; overflow-y: auto; padding-bottom: 20px; }
        
        /* اللوجو في شاشة الدخول */
        .login-logo-img { 
            width: 90%; 
            max-width: 350px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            border: 2px solid #ff0000;
        }

        /* كارت أونلاين */
        .online-badge { position: absolute; top: 20px; left: 20px; border: 2px solid #ff0000; padding: 8px 20px; border-radius: 10px; background: rgba(0,0,0,0.8); font-size: 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 10px rgba(255, 0, 0, 0.3); backdrop-filter: blur(5px); z-index: 10;}
        .online-badge span { color: #ff3333; font-weight: bold; }

        /* اختيار السيرفرات */
        .server-radio-group { display: flex; gap: 15px; border: 2px solid #ff0000; border-radius: 10px; padding: 12px 20px; margin-bottom: 20px; background: rgba(0,0,0,0.85); width: 100%; justify-content: center; box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); backdrop-filter: blur(5px); }
        .server-radio-group label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; color: #aaa; }
        .server-radio-group input[type="radio"] { accent-color: #ff0000; cursor: pointer; }
        .server-radio-group input[type="radio"]:checked + span { color: #fff; font-weight: bold; text-shadow: 0 0 5px #fff; }

        /* حقول الإدخال */
        .input-container { width: 100%; border: 2px solid #ff0000; border-radius: 10px; padding: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.85); display: flex; align-items: center; gap: 10px; box-shadow: 0 0 10px rgba(255, 0, 0, 0.2); backdrop-filter: blur(5px); }
        .input-container .icon { color: #555; font-weight: bold; font-size: 18px; padding: 0 10px; border-right: 1px solid #333; }
        .input-container input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; padding: 5px; letter-spacing: 1px; }
        .input-container input::placeholder { color: #888; }

        /* زر الدخول */
        .btn-login { border: 2px solid #ff0000; background: rgba(20, 0, 0, 0.9); color: #fff; padding: 12px 40px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; box-shadow: 0 0 15px rgba(255, 0, 0, 0.2); backdrop-filter: blur(5px); width: 80%;}
        .btn-login:hover { background: rgba(255, 0, 0, 0.3); box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
        
        .promo-text { margin-top: 15px; font-size: 14px; color: #aaa; letter-spacing: 2px; text-shadow: 0 0 5px #000; }
        .promo-text span { color: #ff0000; font-weight: bold; }

        /* =============================== */
        /* 2. شاشة اللعبة (Game Screen) */
        /* =============================== */
        #game-screen { display: none; flex-direction: column; height: 100%; width: 100%; }
        
        /* الشريط العلوي */
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 10px; margin-top: 5px; }
        .top-box { border: 2px solid #ffd700; border-radius: 10px; padding: 8px 15px; background: rgba(0,0,0,0.8); font-size: 13px; font-weight: bold; color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); backdrop-filter: blur(5px); }
        .top-box .val { color: #a020f0; font-weight: bold; } 

        /* اللوجو في شاشة اللعبة */
        .game-logo-img {
            width: 100%;
            max-height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* حاوية اللعبة */
        .game-board-container { display: flex; gap: 8px; border: 2px solid #ffd700; border-radius: 15px; padding: 10px; background: rgba(0,0,0,0.7); flex-grow: 1; box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); backdrop-filter: blur(5px); overflow-y: auto; }
        
        /* عمود المضاعفات */
        .multipliers { display: flex; flex-direction: column-reverse; justify-content: space-around; padding: 5px 0; width: 65px; }
        .mult-box { border: 2px solid #ffd700; border-radius: 8px; padding: 5px; text-align: center; font-size: 11px; font-weight: bold; color: #ffd700; background: rgba(0,0,0,0.85); box-shadow: inset 0 0 5px rgba(255, 215, 0, 0.2); }
        .mult-box.high { color: #ff0000; border-color: #ff0000; box-shadow: 0 0 8px rgba(255, 0, 0, 0.3); }

        /* شبكة البراميل */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex-grow: 1; }
        .cell { 
            aspect-ratio: 1; 
            border-radius: 50%; 
            cursor: pointer; 
            position: relative;
            background: radial-gradient(circle at 30% 30%, #a0522d, #4a1c00); 
            border: 2px solid #2b0d00;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            display: flex; justify-content: center; align-items: center;
            font-size: 22px;
        }
        .cell::before { content: ''; position: absolute; width: 70%; height: 70%; border-radius: 50%; border: 1px dashed rgba(0,0,0,0.4); }

        /* حالة كشف التفاحة */
        .cell.apple { background: radial-gradient(circle at 30% 30%, #4caf50, #1b5e20); border-color: #0a2a0a; }
        /* حالة كشف المكان الخطأ */
        .cell.bad { background: radial-gradient(circle at 30% 30%, #e6c280, #a67c00); border-color: #4a3000; }

        /* أزرار التحكم السفلية */
        .bottom-controls { display: flex; gap: 10px; margin-top: 15px; padding-bottom: 10px; }
        .action-btn { flex: 1; border: 2px solid #ffd700; background: rgba(0,0,0,0.8); color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: 0.3s; box-shadow: 0 0 10px rgba(255, 215, 0, 0.1); backdrop-filter: blur(5px); }
        .action-btn:hover { background: rgba(255, 215, 0, 0.2); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }

    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="app-container">
        
        <!-- ==================== شاشة الدخول ==================== -->
        <div id="login-screen">
            <div class="online-badge">Online <span id="login-online">78</span></div>

            <!-- اللوجو فوق حقول الإدخال -->
            <img src="logo.png" alt="ZERO BET Logo" class="login-logo-img" onerror="this.style.display='none'">

            <div class="server-radio-group">
                <label><input type="radio" name="server" value="Linbet" checked> <span>Linbet</span></label>
                <label><input type="radio" name="server" value="Server1"> <span>Server1</span></label>
                <label><input type="radio" name="server" value="SERVER2"> <span>SERVER2</span></label>
            </div>

            <div class="input-container">
                <div class="icon">ID</div>
                <input type="text" id="player-id" placeholder="Enter Player ID" maxlength="10">
            </div>
            
            <div class="input-container">
                <div class="icon">🔑</div>
                <input type="password" id="activation-code" placeholder="Enter activation code">
            </div>

            <button class="btn-login" onclick="login()">تسجيل الدخول</button>
            
            <div class="promo-text">PROMO : <span>TE100</span></div>
        </div>

        <!-- ==================== شاشة اللعبة ==================== -->
        <div id="game-screen">
            <div class="top-bar">
                <div class="top-box">ONLINE <span class="val" id="game-online">165</span></div>
                <div class="top-box">ID : <span class="val" id="display-id">--------</span></div>
            </div>

            <!-- اللوجو فوق شبكة التفاحات -->
            <img src="logo.png" alt="ZERO BET Banner" class="game-logo-img" onerror="this.style.display='none'">

            <div class="game-board-container">
                <div class="multipliers" id="multipliers-container"></div>
                <div class="grid" id="grid-container"></div>
            </div>

            <div class="bottom-controls">
                <button class="action-btn" onclick="showApples()">SHOW APPLE</button>
                <button class="action-btn" onclick="newGame()">NEW GAME</button>
            </div>
        </div>

    </div>

    <script>
        // 1. خلفية الماتريكس
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        const letters = "01ZEROBET10HACKTE100";
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0000";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // 2. المتغيرات
        const multipliers = [1.23, 1.54, 1.93, 2.41, 4.02, 6.71, 11.18, 27.92, 69.93, 349.68];
        let applePositions = []; 
        let isRevealed = false;

        setInterval(() => {
            let l = document.getElementById('login-online');
            let g = document.getElementById('game-online');
            if(l) l.innerText = Math.floor(Math.random() * 50) + 50;
            if(g) g.innerText = Math.floor(Math.random() * 100) + 100;
        }, 3000);

        // 3. تسجيل الدخول
        function login() {
            let idValue = document.getElementById('player-id').value;
            let passValue = document.getElementById('activation-code').value;

            if (idValue.length !== 10) {
                alert("الآي دي (ID) لازم يكون 10 أرقام بالظبط!");
                return; 
            }

            if (passValue.toUpperCase() !== "TE100") {
                alert("الباسورد غلط! اكتب TE100");
                return;
            }

            // إخفاء الدخول وإظهار اللعبة
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex'; 
            document.getElementById('display-id').innerText = idValue; 
            initBoard(); 
        }

        // 4. رسم اللوحة
        function initBoard() {
            const multContainer = document.getElementById('multipliers-container');
            multContainer.innerHTML = '';
            multipliers.forEach((mult, index) => {
                let div = document.createElement('div');
                div.className = 'mult-box' + (index >= 7 ? ' high' : '');
                div.innerText = 'x' + mult;
                multContainer.appendChild(div);
            });

            generateNewGameData();
            renderGrid();
        }

        function generateNewGameData() {
            applePositions = [];
            for (let i = 0; i < 10; i++) {
                applePositions.push(Math.floor(Math.random() * 5)); 
            }
            localStorage.setItem('zeroBetPreds', JSON.stringify(applePositions));
            isRevealed = false;
        }

        function renderGrid() {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            
            for (let row = 9; row >= 0; row--) {
                for (let col = 0; col < 5; col++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    if (isRevealed) {
                        if (col === applePositions[row]) cell.classList.add('apple');
                        else cell.classList.add('bad');
                    }
                    
                    cell.onclick = () => handleCellClick(cell, row, col);
                    grid.appendChild(cell);
                }
            }
        }

        // 5. الأزرار
        function showApples() {
            isRevealed = true;
            renderGrid();
        }

        function newGame() {
            generateNewGameData(); 
            renderGrid();          
        }

        function handleCellClick(cell, row, col) {
            if (isRevealed) return; 
            if (col === applePositions[row]) cell.classList.add('apple');
            else cell.classList.add('bad');
        }
    </script>
</body>
</html>

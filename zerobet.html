<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO BET - Predictor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        
        body { background-color: #050005; color: #fff; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; position: relative; }
        
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.4; pointer-events: none; }

        .floating-icons-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; }
        .f-icon { position: absolute; bottom: -50px; opacity: 0; animation: floatUp linear infinite; }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
        
        .app-container { width: 100%; max-width: 450px; height: 100dvh; position: relative; z-index: 1; display: flex; flex-direction: column; }

        /* شاشة تسجيل الدخول */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; padding: 15px; }
        .login-logo-img { width: 70px; height: 70px; object-fit: cover; border-radius: 15px; margin-bottom: 20px; border: 2px solid #ff0000; box-shadow: 0 0 20px rgba(255,0,0,0.6); }
        .online-badge { position: absolute; top: 20px; left: 20px; border: 2px solid #ff0000; padding: 8px 20px; border-radius: 10px; background: rgba(0,0,0,0.8); font-size: 14px; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(5px); z-index: 10;}
        .online-badge span { color: #ff3333; font-weight: bold; }
        .server-radio-group { display: flex; gap: 15px; border: 2px solid #ff0000; border-radius: 10px; padding: 12px 20px; margin-bottom: 20px; background: rgba(0,0,0,0.85); width: 100%; justify-content: center; }
        .server-radio-group label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; color: #aaa; }
        .server-radio-group input[type="radio"]:checked + span { color: #fff; font-weight: bold; text-shadow: 0 0 5px #fff; }
        .input-container { width: 100%; border: 2px solid #ff0000; border-radius: 10px; padding: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.85); display: flex; align-items: center; gap: 10px; }
        .input-container .icon { color: #555; font-weight: bold; font-size: 18px; padding: 0 10px; border-right: 1px solid #333; }
        .input-container input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; padding: 5px; }
        .btn-login { border: 2px solid #ff0000; background: rgba(20, 0, 0, 0.9); color: #fff; padding: 12px 40px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 80%;}
        .tg-login-link { margin-top: 15px; display: flex; align-items: center; gap: 8px; color: #0088cc; text-decoration: none; font-weight: bold; font-size: 14px; background: rgba(0, 136, 204, 0.1); padding: 8px 15px; border-radius: 20px; border: 1px solid #0088cc; transition: 0.3s;}
        .tg-login-link svg { width: 20px; height: 20px; fill: #0088cc; }
        .promo-text { margin-top: 10px; font-size: 14px; color: #aaa; }
        .promo-text span { color: #ff0000; font-weight: bold; }

        /* شاشة اللعبة */
        #game-screen { display: none; flex-direction: column; height: 100%; width: 100%; position: relative; }
        .top-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(18, 11, 46, 0.8); backdrop-filter: blur(5px); border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; border-bottom: 1px solid #331166; }
        .header-logo { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; border: 1px solid #ff0055; }
        .welcome-text { color: #d47b9a; font-size: 15px; line-height: 1.4; font-weight: bold; }
        .welcome-text span { color: #fff; }
        .menu-btn { background: #dcdcdc; border: none; border-radius: 8px; width: 35px; height: 35px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; }
        .menu-btn div { width: 18px; height: 2px; background: #333; }
        .floating-online { position: absolute; top: 75px; left: 20px; border: 2px solid #00ffcc; padding: 5px 15px; border-radius: 20px; background: rgba(0,0,0,0.8); font-size: 12px; color: #fff; backdrop-filter: blur(4px); z-index: 10; box-shadow: 0 0 10px #00ffcc; }
        .floating-online span { color: #00ffcc; font-weight: bold; }

        .main-card { flex-grow: 1; background: rgba(15, 10, 25, 0.85); backdrop-filter: blur(15px); border: 1px solid #ff0055; border-top-left-radius: 40px; border-top-right-radius: 40px; margin-top: 10px; padding: 25px 20px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; overflow-y: auto; box-shadow: 0 -10px 30px rgba(255, 0, 85, 0.2); }

        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; margin-bottom: 25px; margin-top: 20px;}
        .pink-box { aspect-ratio: 1; background: #fce4ec; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: all 0.3s ease; }
        
        .static-check { color: #4caf50; font-weight: bold; font-size: 24px; display: inline-block; animation: spinCheck 2s linear infinite; }
        @keyframes spinCheck { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .apple-icon { font-size: 28px; }
        
        .id-section { width: 60%; text-align: center; margin-bottom: 20px; }
        .id-label { font-size: 16px; color: #aaa; margin-bottom: 5px; }
        .id-value { border-bottom: 2px solid #ff0055; padding-bottom: 5px; font-size: 20px; font-weight: bold; color: #fff; height: 35px; text-shadow: 0 0 10px #ff0055;}

        .action-buttons { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .action-btn { background: #130b2e; color: #fff; border: 1px solid #ff0055; border-radius: 25px; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px rgba(255,0,85,0.2); }
        .action-btn:hover { background: #ff0055; color: #fff; box-shadow: 0 0 20px rgba(255,0,85,0.6); }

        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 70px; background: #1a103c; display: flex; justify-content: space-around; align-items: center; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 10; padding-bottom: 10px; border-top: 1px solid #331166;}
        .nav-icon { color: #fff; font-size: 24px; cursor: pointer; opacity: 0.6; transition: 0.3s; display: flex; justify-content: center; align-items: center;}
        .nav-icon.active { opacity: 1; color: #d47b9a; }
        .nav-icon svg { width: 28px; height: 28px; fill: #0088cc; }
        .nav-icon.center-icon { background: #fff; color: #1a103c; border-radius: 50%; width: 50px; height: 50px; margin-top: -20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 20px; opacity: 1;}
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div class="floating-icons-container" id="floatingIcons"></div>

    <div class="app-container">
        <!-- شاشة الدخول -->
        <div id="login-screen">
            <div class="online-badge">Online <span id="login-online">78</span></div>
            <img src="logo.png" alt="Logo" class="login-logo-img" onerror="this.style.display='none'">
            <div class="server-radio-group">
                <label><input type="radio" name="server" checked> <span>Linbet</span></label>
                <label><input type="radio" name="server"> <span>Server1</span></label>
                <label><input type="radio" name="server"> <span>SERVER2</span></label>
            </div>
            <div class="input-container">
                <div class="icon">ID</div>
                <input type="text" id="player-id" placeholder="Enter Player ID" maxlength="10">
            </div>
            <div class="input-container">
                <div class="icon">🔑</div>
                <input type="password" id="activation-code" placeholder="Enter activation code">
            </div>
            <button class="btn-login" onclick="login()">تسجيل الدخول</button>
            <a href="https://t.me/+YLOI8Jc3Gjg4OWFk" target="_blank" class="tg-login-link">
                <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
                Join Telegram Channel
            </a>
            <div class="promo-text">PROMO : <span>TE100</span></div>
        </div>

        <!-- شاشة اللعبة -->
        <div id="game-screen">
            <div class="top-header">
                <img src="logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <div class="welcome-text">Hellow Friends, <br> Welcome Back!</div>
                <button class="menu-btn"><div></div><div></div><div></div></button>
            </div>
            <div class="floating-online">ONLINE <span id="game-online">165</span></div>

            <div class="main-card">
                <div class="grid-container" id="grid-container"></div>
                <div class="id-section">
                    <div class="id-label">iD</div>
                    <div class="id-value" id="display-id">--------</div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn" onclick="nextStage()">Stars</button>
                    <button class="action-btn" onclick="resetGame()">Stop</button>
                </div>
            </div>

            <div class="bottom-nav">
                <div class="nav-icon active">🏠</div>
                <div class="nav-icon">📄</div>
                <div class="nav-icon center-icon">✈️</div>
                <a href="https://t.me/+YLOI8Jc3Gjg4OWFk" target="_blank" class="nav-icon">
                    <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
                </a>
                <div class="nav-icon">👤</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        const letters = "01ZEROBET10HACKTE100";
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0000";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        const iconsContainer = document.getElementById('floatingIcons');
        const iconList = ['💎', '🍎', '✈️', '➕', '🍒', '🎲'];
        function createFloatingIcon() {
            const icon = document.createElement('div');
            icon.className = 'f-icon';
            icon.innerText = iconList[Math.floor(Math.random() * iconList.length)];
            icon.style.left = Math.random() * 100 + 'vw';
            icon.style.fontSize = (Math.random() * 20 + 15) + 'px';
            icon.style.animationDuration = (Math.random() * 5 + 5) + 's';
            icon.style.animationDelay = (Math.random() * 2) + 's';
            iconsContainer.appendChild(icon);
            setTimeout(() => { icon.remove(); }, 10000);
        }
        setInterval(createFloatingIcon, 500);

        // ==========================================
        // التعديل هنا: خليت التوتال 10 بدل 5
        // ==========================================
        let currentStage = 0;
        let predictions = [];
        const totalStages = 10; 

        setInterval(() => {
            let l = document.getElementById('login-online');
            let g = document.getElementById('game-online');
            if(l) l.innerText = Math.floor(Math.random() * 50) + 50;
            if(g) g.innerText = Math.floor(Math.random() * 100) + 100;
        }, 3000);

        function login() {
            let idValue = document.getElementById('player-id').value;
            let passValue = document.getElementById('activation-code').value;

            if (idValue.length !== 10) { alert("الآي دي (ID) لازم يكون 10 أرقام بالظبط!"); return; }
            if (passValue.toUpperCase() !== "TE100") { alert("الباسورد غلط! اكتب TE100"); return; }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex'; 
            document.getElementById('display-id').innerText = idValue;
            initBoard(); 
        }

        function initBoard() {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                let box = document.createElement('div');
                box.className = 'pink-box';
                box.id = 'box-' + i;
                grid.appendChild(box);
            }
            resetGame();
        }

        // توليد 10 توقعات (من 0 لـ 4) عشان تمثل الـ 10 صفوف في لاين بيت
        function generateNewGameData() {
            predictions = [];
            for (let i = 0; i < totalStages; i++) {
                predictions.push(Math.floor(Math.random() * 5)); 
            }
            localStorage.setItem('zeroBetPreds', JSON.stringify(predictions));
            currentStage = 0;
        }

        function resetGame() {
            generateNewGameData();
            for (let i = 0; i < 10; i++) {
                let box = document.getElementById('box-' + i);
                box.innerHTML = '';
                // الصف العلوي (0-4) بعلامات الصح اللي بتلف
                if (i < 5) {
                    box.innerHTML = '<span class="static-check">✔</span>';
                }
            }
        }

        function nextStage() {
            if (currentStage >= totalStages) {
                alert("لقد وصلت لنهاية اللعبة (10 مرات)! اضغط Stop للبدء من جديد.");
                return;
            }

            // نمسح التفاحة القديمة من الصف السفلي
            for (let i = 5; i < 10; i++) {
                document.getElementById('box-' + i).innerHTML = '';
            }

            // نجيب مكان التفاحة للدور الحالي (من 0 لـ 4) ونحطها في الصف السفلي
            let col = predictions[currentStage];
            let boxIndex = 5 + col; 
            let currentBox = document.getElementById('box-' + boxIndex);
            
            currentBox.innerHTML = '<span class="apple-icon">🍎</span>';
            currentStage++;
        }
    </script>
</body>
</html>
